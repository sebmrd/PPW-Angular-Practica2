<h1> Students Page </h1>
<p> Seleccion el estudiante para ver sus detalles </p> 

<ul>
    @for (estudiante of students(); track estudiante.id) {
        <li>
            <a [routerLink] ="['/students', estudiante.id]">

            </a>
        </li>
    }@empty {
        <li> listado VACIO </li>
    }
</ul>

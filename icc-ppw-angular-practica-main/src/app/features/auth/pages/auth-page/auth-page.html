<section class="flex min-h-[80vh] items-center justify-center relative overflow-hidden bg-slate-950 px-4">
  <div class="absolute top-0 left-1/4 w-[400px] h-[400px] bg-emerald-600/20 rounded-full blur-[120px] -z-10"></div>
  <div class="absolute bottom-0 right-1/4 w-[400px] h-[400px] bg-indigo-600/20 rounded-full blur-[120px] -z-10"></div>

  <div class="w-full max-w-sm border border-slate-700/50 bg-slate-800/80 backdrop-blur-xl shadow-2xl rounded-3xl relative z-10">
    <div class="p-8 flex flex-col gap-6">

      <h2 class="text-3xl font-extrabold tracking-tight text-transparent bg-clip-text bg-gradient-to-r from-white via-slate-200 to-slate-400 text-center">
        @if (isLogin()) { Iniciar sesion } @else { Crear cuenta }
      </h2>

      <form [formGroup]="authForm" (ngSubmit)="onSubmit()" class="space-y-5">

        <div class="flex flex-col gap-2">
          <label class="flex justify-between items-center" for="email">
            <span class="text-sm font-medium text-slate-300">Correo electronico</span>
          </label>
          <input
            id="email"
            type="email"
            formControlName="email"
            placeholder="user@gmail.com"
            class="w-full bg-slate-900/50 border border-slate-700 rounded-xl px-4 py-3 text-slate-200 placeholder-slate-500 focus:outline-none focus:ring-2 focus:ring-emerald-500/50 focus:border-emerald-500 transition-all duration-300"
            [class.!border-red-500]="authForm.get('email')?.invalid && authForm.get('email')?.touched"
            [class.focus:!ring-red-500/50]="authForm.get('email')?.invalid && authForm.get('email')?.touched"
          />
        </div>

        <div class="flex flex-col gap-2">
          <label class="flex justify-between items-center" for="password">
            <span class="text-sm font-medium text-slate-300">Contrasena</span>
          </label>
          <input
            id="password"
            type="password"
            formControlName="password"
            placeholder="••••••"
            class="w-full bg-slate-900/50 border border-slate-700 rounded-xl px-4 py-3 text-slate-200 placeholder-slate-500 focus:outline-none focus:ring-2 focus:ring-emerald-500/50 focus:border-emerald-500 transition-all duration-300"
            [class.!border-red-500]="authForm.get('password')?.invalid && authForm.get('password')?.touched"
            [class.focus:!ring-red-500/50]="authForm.get('password')?.invalid && authForm.get('password')?.touched"
          />
        </div>

        @if (errorMessage()) {
          <div class="bg-red-500/10 border border-red-500/50 text-red-400 px-4 py-3 rounded-xl text-sm font-medium flex items-center gap-2">
            <span>{{ errorMessage() }}</span>
          </div>
        }

        <button
          type="submit"
          class="w-full bg-emerald-500 text-slate-950 px-8 py-3.5 rounded-xl font-bold text-sm uppercase tracking-wider hover:-translate-y-1 hover:shadow-[0_10px_20px_-10px_rgba(16,185,129,0.5)] transition-all duration-300 disabled:opacity-50 disabled:hover:translate-y-0 disabled:hover:shadow-none flex justify-center items-center gap-2 mt-2"
          [disabled]="authForm.invalid || isLoading()"
        >
          @if (isLoading()) {
            <span class="block w-5 h-5 border-2 border-slate-950 border-t-transparent rounded-full animate-spin"></span>
          } @else if (isLogin()) {
            Ingresar
          } @else {
            Registrarse
          }
        </button>
      </form>

      <p class="text-center text-sm text-slate-400 mt-2">
        @if (isLogin()) {
          ¿No tienes cuenta?
          <button class="text-emerald-400 font-semibold hover:text-emerald-300 transition-colors ml-1 focus:outline-none" (click)="toggleMode()">Registrate aqui</button>
        } @else {
          ¿Ya tienes cuenta?
          <button class="text-emerald-400 font-semibold hover:text-emerald-300 transition-colors ml-1 focus:outline-none" (click)="toggleMode()">Inicia sesion</button>
        }
      </p>

    </div>
  </div>
</section>
